command: ["streamlit", "run", "cobol_converter_app.py"]

env:
  # Databricks workspace hostname
  - name: "DATABRICKS_HOST"
    value: "adb-984752964297111.11.azuredatabricks.net"

  # Foundation Model API endpoint name
  # To switch models, change this value to your endpoint name
  # Examples:
  #   - "databricks-claude-sonnet-4-5" (BEST for SQL - switch back if rate limits ok)
  #   - "databricks-meta-llama-3-3-70b-instruct" (current - good for PySpark, weaker for SQL)
  #   - "databricks-meta-llama-3-1-8b-instruct" (highest rate limits, lower quality)
  #   - "databricks-dbrx-instruct"
  #   - Your custom provisioned throughput endpoint
  - name: "SERVING_ENDPOINT_NAME"
    value: "databricks-claude-sonnet-4-5"

  # Maximum tokens per conversion (controls output length)
  # Lower values = faster, cheaper, but may truncate long code
  # Higher values = complete code, but uses more tokens
  # Default: 8000 (good for most conversions)
  - name: "MAX_TOKENS"
    value: "8000"

  # User prefix for resource naming (will be vikcbl for user vik.malhotra)
  - name: "USER_PREFIX"
    value: "vikcbl" # USER_PREFIX

  # Source catalog with existing gold tables from mainframe
  - name: "SOURCE_CATALOG"
    value: "vikcbl_payer_dev" # SOURCE_CATALOG

  # Target catalog for converted COBOL→PySpark analytical outputs
  - name: "TARGET_CATALOG"
    value: "vikcbl_payer_analyst_dev" # TARGET_CATALOG

  # Default schema in source catalog
  - name: "SOURCE_SCHEMA"
    value: "analytics_gold"

  # Default schema in target catalog
  - name: "TARGET_SCHEMA"
    value: "default"

  # Volume catalog for browsing COBOL files
  - name: "VOLUME_CATALOG"
    value: "vikcbl_payer_dev"

  # Volume schema
  - name: "VOLUME_SCHEMA"
    value: "cobol_migration"

  # Volume name containing legacy COBOL files
  - name: "VOLUME_NAME"
    value: "legacy_cobol"

  # Legacy language identifier (for UI display)
  - name: "LEGACY_LANGUAGE"
    value: "COBOL"
